[project]
name = "coimbrice-profile"
version = "0.1.0"
description = "Scripts that render the images on my GitHub profile README"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
